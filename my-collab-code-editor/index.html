<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collaborative Code Editor</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>Collaborative Code Editor</h1>

    <!-- User Authentication Section -->
    <div id="auth-section">
      <h2>Login</h2>
      <form id="login-form">
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>

      <button id="google-login">Login with Google</button>
      <button id="github-login">Login with GitHub</button>

      <h2>Sign Up</h2>
      <form id="signup-form">
        <input type="email" id="signup-email" placeholder="Email" required />
        <input type="password" id="signup-password" placeholder="Password" required />
        <button type="submit">Sign Up</button>
      </form>
    </div>

    <!-- Code Editor Section (Only Visible After Login) -->
    <div id="editor-container" style="display: none;">
      <button id="logout-button">Logout</button>
      <div id="editor" style="height: 80vh; width: 100%;"></div>
    </div>

    <!-- RequireJS Loader -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>

    <!-- Main Application Script -->
    <script type="module" src="/src/script.js"></script>
  </body>
</html>

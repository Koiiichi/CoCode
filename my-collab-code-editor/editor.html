<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CoCode Editor</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="editor-app">
    <!-- Header -->
    <div class="title-bar">
      <div class="title-left">
        <img src="/assets/logo_white.png" class="editor-logo" alt="Logo" />
        <span class="editor-title">CoCode</span>
      </div>
      <div class="profile-menu">
        <button class="profile-button">👤</button>
        <div class="profile-dropdown">
          <button id="logout-button" class="logout-btn">Logout</button>
        </div>
      </div>
    </div>

    <!-- Main Editor Layout -->
    <div class="editor-main">
      <!-- Sidebar -->
      <div class="sidebar">
        <button title="Files">📁</button>
        <button title="Search">🔍</button>
        <button title="Settings">⚙️</button>
      </div>

      <!-- Editor Area -->
      <div class="editor-wrapper">
        <div class="tab-bar">
          <div class="tab active">index.js</div>
        </div>
        <div id="editor"></div>
      </div>
    </div>

    <!-- Monaco Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script type="module" src="/src/editor.js"></script>
  </body>
</html>

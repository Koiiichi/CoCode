<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>CoCode Editor</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body class="editor-app">
    <!-- Header -->
    <div class="title-bar">
      <div class="title-left">
        <!-- HOME button -->
        <button id="home-button" class="home-btn">Home</button>
        <img src="/assets/logo_white.png" class="editor-logo" alt="Logo" />
        <span class="editor-title">CoCode</span>
      </div>
      <div class="profile-menu">
        <button class="profile-button">👤</button>
        <div class="profile-dropdown">
          <button id="logout-button" class="logout-btn">Logout</button>
        </div>
      </div>
    </div>

    <!-- Main Editor Layout -->
    <div class="editor-main">
      <!-- Sidebar -->
      <div class="sidebar">
        <button class="sidebar-btn" id="files-btn" title="Files">
          <img src="/assets/files-icon.png" alt="Files" />
        </button>
        <button class="sidebar-btn" id="search-btn" title="Search">
          <img src="/assets/search-icon.png" alt="Search" />
        </button>
        <button class="sidebar-btn" id="settings-btn" title="Settings">
          <img src="/assets/settings-icon.png" alt="Settings" />
        </button>
      </div>

      <!-- Editor Area -->
      <div class="editor-wrapper">
        <!-- Slide-out Panels for Files, Search, Settings (placeholders) -->
        <div class="slide-panel hidden" id="files-panel">
          <h3>Files Panel</h3>
          <!-- Potentially list files or show project structure here -->
        </div>
        <div class="slide-panel hidden" id="search-panel">
          <h3>Search Panel</h3>
          <!-- Potentially implement search in the future -->
        </div>
        <div class="slide-panel hidden" id="settings-panel">
          <h3>Settings Panel</h3>
          <!-- Potential theme, font-size, auto-save toggles in the future -->
        </div>

        <!-- Tab Bar -->
        <div class="tab-bar" id="tab-bar">
          <!-- Dynamic tabs get appended here. -->
          <div class="tab-add" id="add-file-tab" title="Add File">
            <img src="/assets/add-icon.png" alt="Add File" />
          </div>                  
        </div>

        <!-- Monaco Editor -->
        <div id="editor"></div>
      </div>
    </div>

    <!-- Monaco Loader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.6/require.min.js"></script>
    <script type="module" src="/src/editor.js"></script>
  </body>
</html>

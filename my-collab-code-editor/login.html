<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Login | CoCode</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="login-body">
    <div class="app-header">
      <img src="/assets/logo.png" alt="Logo" class="app-logo" />
      <span class="app-name">CoCode</span>
    </div>

    <div class="auth-container">
      <h2>Log in to your account</h2>

      <form id="login-form" class="auth-form">
        <input type="email" id="login-email" placeholder="Email" required />
        <input type="password" id="login-password" placeholder="Password" required />
        <button type="submit" class="primary-btn">Login</button>
      </form>

      <div class="social-logins">
        <button id="google-login" class="social-btn google">
          <img src="/assets/google-icon.png" alt="Google" /> Continue with Google
        </button>
        <button id="github-login" class="social-btn github">
          <img src="/assets/github-icon.png" alt="GitHub" /> Continue with GitHub
        </button>
      </div>

      <a class="link" href="signup.html">Don't have an account? Sign up</a>
    </div>

    <script type="module" src="/src/login.js"></script>
  </body>
</html>

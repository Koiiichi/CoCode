name: Git Branch Graph & Status

on:
  push:
    branches:
      - "**"  # Triggers on every branch push

jobs:
  branch-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Check Out Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history to compare commits

      - name: Generate Simple Branch Graph
        id: generate
        run: |
          echo "Generating a simplified branch listing..."

          # List all local branches
          BRANCHES=$(git branch --format='%(refname:short)')
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          SIMPLE_GRAPH=""

          for BRANCH in $BRANCHES; do
            # Get the short commit hash for the branch
            COMMIT=$(git rev-parse --short "$BRANCH")
            
            # Initialize status string
            STATUS=""

            # Compare branch to main if it's not main
            if [ "$BRANCH" != "main" ]; then
              # Compare main vs this branch:
              # This returns two numbers: [commits unique to main] [commits unique to branch]
              AHEAD_BEHIND=$(git rev-list --left-right --count main..."$BRANCH")
              BEHIND=$(echo $AHEAD_BEHIND | cut -d' ' -f1)
              AHEAD=$(echo $AHEAD_BEHIND | cut -d' ' -f2)
              
              if [ "$BEHIND" -gt 0 ] && [ "$AHEAD" -gt 0 ]; then
                STATUS=" (ahead of main by $AHEAD, behind main by $BEHIND)"
              elif [ "$BEHIND" -gt 0 ]; then
                STATUS=" (behind main by $BEHIND)"
              elif [ "$AHEAD" -gt 0 ]; then
                STATUS=" (ahead of main by $AHEAD)"
              fi
            fi

            if [ "$BRANCH" = "$CURRENT_BRANCH" ]; then
              SIMPLE_GRAPH="$SIMPLE_GRAPH\nHEAD -> $BRANCH -> $COMMIT$STATUS"
            else
              SIMPLE_GRAPH="$SIMPLE_GRAPH\n$BRANCH -> $COMMIT$STATUS"
            fi
          done

          # Remove the initial newline
          SIMPLE_GRAPH=$(echo -e "$SIMPLE_GRAPH" | sed '1d')

          # Output the result to the GitHub Actions summary
          echo "### 🛠️ Simple Branch Map" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "$SIMPLE_GRAPH" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          # Set output for later steps (e.g., Discord)
          echo "graph<<EOF" >> "$GITHUB_OUTPUT"
          echo "$SIMPLE_GRAPH" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Send Branch Graph to Discord
        env:
          DISCORD_BRANCHUPDATE_WEBHOOK_URL: ${{ secrets.DISCORD_BRANCHUPDATE_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_BRANCHUPDATE_WEBHOOK_URL" ]; then
            echo "Skipping Discord notification: No webhook set."
            exit 0
          fi

          echo "Preparing payload for Discord..."
          GRAPH_JSON=$(echo "${{ steps.generate.outputs.graph }}" | jq -Rs .)

          PAYLOAD=$(jq -n --arg graph "$GRAPH_JSON" '{
            embeds: [{
              title: "Git Branch Graph",
              description: "```bash\n" + $graph + "\n```",
              color: 3447003
            }]
          }')

          echo "Sending payload to Discord..."
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "$PAYLOAD" \
               "$DISCORD_BRANCHUPDATE_WEBHOOK_URL"
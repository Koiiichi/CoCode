name: Post Commit Messages to Discord
on:
  push:
    branches:
      - main
      - features/**
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Ensure we fetch the full repo history
      - name: Send commit messages to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DIFF_LINES: 5  # Number of diff lines to show
        run: |
          set -eo pipefail
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "Error: DISCORD_WEBHOOK_URL is not set."
            exit 1
          fi
          
          # Build a summary of commit messages for all commits pushed.
          COMMIT_COUNT=$(echo '${{ toJson(github.event.commits) }}' | jq 'length')
          if [ "$COMMIT_COUNT" -gt 0 ]; then
            # Extract commit messages without quotes and escape sequences
            COMMIT_MESSAGES=$(echo '${{ toJson(github.event.commits) }}' | jq -r '.[].message' | sed -z 's/\n/\\n/g')
          else
            # Remove quotes and escape sequences from the commit message
            COMMIT_MESSAGES=$(echo "${{ github.event.head_commit.message }}" | sed -z 's/\n/\\n/g')
          fi
          
          COMMIT_AUTHOR="${{ github.actor }}"
          BRANCH_NAME="${{ github.ref_name }}"
          
          # Get the diff for the most recent commit, limited by DIFF_LINES and clean up escape sequences
          DIFF=$(git show --stat --color=never --unified=5 --format="" HEAD | head -n $DIFF_LINES | sed -z 's/\n/\\n/g')
          TIMESTAMP=$(date --utc +%Y-%m-%dT%H:%M:%SZ)
          
          # Create a raw JSON payload without escaping
          cat > payload.json << EOF
          {
            "embeds": [
              {
                "title": "New Commit Pushed",
                "description": "**Branch:** \`$BRANCH_NAME\`\n\n**Commit Message(s):**\n\`\`\`\n$COMMIT_MESSAGES\n\`\`\`\n**Author:** $COMMIT_AUTHOR\n\n**Changes:**\n\`\`\`\ndiff\n$DIFF\n\`\`\`",
                "color": 16776960,
                "timestamp": "$TIMESTAMP"
              }
            ]
          }
          EOF
          
          # Post the payload to Discord and exit if the request is unsuccessful.
          curl -f -H "Content-Type: application/json" \
               -X POST \
               -d @payload.json \
               "$DISCORD_WEBHOOK_URL"
